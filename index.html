<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a5c2a" />
  <title>Orçamento de Resíduos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <!-- Versão fixada: evita que uma atualização do CDN quebre o formulário -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>

  <style>
    :root {
      --bg:          #d4edda;
      --surface:     #ffffff;
      --header:      #1a5c2a;
      --border:      #7aba8a;
      --accent:      #1a5c2a;
      --text:        #0d1f0f;
      --label:       #1a3d20;
      --muted:       #3d6b47;
      --placeholder: #4f7157;
      --input-bg:    #f0faf2;
      --danger:      #b3261e;
      --radius:      8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
      -webkit-text-size-adjust: 100%;
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    /* ---------- Header compacto ---------- */
    header {
      background: var(--header);
      padding: 8px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 640px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-logo { height: 32px; width: auto; object-fit: contain; border-radius: 4px; flex-shrink: 0; }
    header h1 { white-space: nowrap; font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 0.01em; }
    .header-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; font-weight: 500; color: #cdeed6; white-space: nowrap;
    }

    /* ---------- Aviso (falha ao carregar o sistema) ---------- */
    #aviso-banner {
      display: none;
      background: #fdecea;
      border: 2px solid var(--danger);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--danger);
      font-weight: 600;
    }

    /* ---------- Seções e cards ---------- */
    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700; color: var(--accent);
      margin: 22px 0 10px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .field { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size: 13px; font-weight: 600; color: var(--label);
    }
    label .opt { font-weight: 400; color: var(--muted); font-size: 12px; }
    .required-mark { color: var(--danger); margin-left: 2px; }

    /* 16px evita o zoom automático do Safari no iPhone ao focar o campo */
    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid #9dc7a5;
      border-radius: var(--radius);
      padding: 12px 13px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    select {
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }
    select option { background: #fff; color: var(--text); }

    input::placeholder, textarea::placeholder { color: var(--placeholder); font-weight: 400; }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(26,92,42,0.15);
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 340px) { .grid-2 { grid-template-columns: 1fr; } }
    @media (max-width: 440px) { .grid-2.stack-sm { grid-template-columns: 1fr; } }

    /* ---------- Validação inline ---------- */
    .field-error { display: none; color: var(--danger); font-size: 13px; font-weight: 600; }
    .field.invalid .field-error { display: block; }
    .field.invalid input, .field.invalid select { border-color: var(--danger); background-color: #ffffff; }

    /* ---------- Fotos ---------- */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .foto-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .foto-btn {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 86px; padding: 10px;
      border: 2px dashed #7fb48b; border-radius: var(--radius);
      background: var(--input-bg); color: var(--accent);
      font-size: 14px; font-weight: 700; text-align: center;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .foto-btn .ico { font-size: 26px; line-height: 1; }
    .foto-btn:active { background: #e0f3e5; border-color: var(--accent); }
    .foto-btn:focus-within { outline: 3px solid rgba(26,92,42,0.35); outline-offset: 2px; }
    .foto-btn.disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    .foto-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
    #foto-count { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

    .fotos-preview { display: flex; flex-wrap: wrap; gap: 10px; }
    .fotos-preview:empty { display: none; }

    .foto-thumb {
      position: relative; width: 92px; height: 92px;
      border-radius: 6px; overflow: hidden;
      border: 2px solid var(--border); background: #e8f5eb;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--muted); text-align: center;
    }
    .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* área de toque de 44px; o círculo visível é menor */
    .foto-thumb .remove-foto {
      position: absolute; top: 0; right: 0; width: 44px; height: 44px;
      background: none; border: 0; cursor: pointer;
    }
    .foto-thumb .remove-foto::before {
      content: '×';
      position: absolute; top: 4px; right: 4px; width: 26px; height: 26px;
      border-radius: 50%; background: rgba(0,0,0,0.72); color: #fff;
      font-size: 18px; line-height: 26px; text-align: center;
    }
    .foto-thumb.processing .mini-spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid rgba(26,92,42,0.25); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    /* ---------- Botões ---------- */
    .btn-submit {
      width: 100%; min-height: 54px;
      background: var(--accent); color: #ffffff;
      border: none; border-radius: var(--radius);
      padding: 14px;
      font-family: inherit; font-size: 16px; font-weight: 700;
      margin-top: 24px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(26,92,42,0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover  { background: #14471f; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #6f9577; cursor: not-allowed; box-shadow: none; }
    .btn-submit .spinner {
      display: none; width: 18px; height: 18px; flex-shrink: 0;
      border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn-submit.loading .spinner { display: block; }

    .btn-secondary {
      width: 100%; min-height: 50px; margin-top: 18px;
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Confirmação pós-envio ---------- */
    #sucesso { display: none; }
    .sucesso-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 28px 18px 22px; margin-top: 24px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .sucesso-ico {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 30px; line-height: 56px; margin: 0 auto 12px;
    }
    .sucesso-card h2 { font-size: 20px; color: var(--accent); margin-bottom: 4px; }
    .sucesso-card p { font-size: 14px; color: var(--muted); }
    .resumo { list-style: none; text-align: left; margin: 18px 0 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .resumo li { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid #e1efe4; padding-bottom: 8px; }
    .resumo li span:first-child { color: var(--muted); flex-shrink: 0; }
    .resumo li span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: calc(100% - 32px);
      border-radius: 16px; padding: 12px 20px;
      font-size: 14px; font-weight: 600; color: #fff; text-align: center;
      z-index: 999;
      display: flex; align-items: center; gap: 9px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      opacity: 0; pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
    }
    #toast.show    { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: #1a5c2a; }
    #toast.error   { background: var(--danger); }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.55); flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<div class="wrap">
  <div id="aviso-banner" role="alert"></div>

  <!-- ===================== FORMULÁRIO ===================== -->
  <main id="form-area">
    <input type="hidden" id="data_visita" />

    <!-- CLIENTE -->
    <div class="section-title"><span aria-hidden="true">🏭</span> Dados do cliente</div>
    <div class="card">
      <div class="field">
        <label for="nome_cliente">Razão Social / Nome <span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" id="nome_cliente" placeholder="Ex: Indústria Exemplo Ltda" autocomplete="off" aria-required="true" aria-describedby="erro-nome_cliente" />
        <div class="field-error" id="erro-nome_cliente"></div>
      </div>
      <div class="grid-2 stack-sm">
        <div class="field">
          <label for="cnpj">CNPJ <span class="opt">(opcional)</span></label>
          <input type="text" id="cnpj" placeholder="00.000.000/0001-00" maxlength="18" inputmode="numeric" autocomplete="off" />
        </div>
        <div class="field">
          <label for="telefone">Telefone <span class="opt">(opcional)</span></label>
          <input type="tel" id="telefone" placeholder="(31) 9 0000-0000" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label for="email">E-mail <span class="opt">(opcional)</span></label>
        <input type="email" id="email" placeholder="contato@empresa.com.br" autocomplete="off" autocapitalize="none" />
      </div>
      <div class="field">
        <label for="endereco">Endereço do gerador <span class="opt">(opcional)</span></label>
        <input type="text" id="endereco" placeholder="Rua, número, cidade – UF" autocomplete="off" />
      </div>
    </div>

    <!-- RESÍDUOS -->
    <div class="section-title"><span aria-hidden="true">🗂</span> Dados técnicos dos resíduos</div>
    <div class="card">
      <div class="field">
        <label for="tipo_residuo">Tipo de resíduo <span class="required-mark" aria-hidden="true">*</span></label>
        <select id="tipo_residuo" aria-required="true" aria-describedby="erro-tipo_residuo">
          <option value="">— Selecione o tipo —</option>
          <option>Resíduo Industrial Perigoso</option>
          <option>Resíduo Industrial Não Perigoso</option>
          <option>Resíduo de Construção Civil (RCC)</option>
          <option>Resíduo de Serviços de Saúde (RSS)</option>
          <option>Resíduo de Óleo e Lubrificante</option>
          <option>Resíduo Eletrônico (REEE)</option>
          <option>Resíduo Orgânico</option>
          <option>Embalagens Contaminadas</option>
          <option>Resíduo Químico Laboratorial</option>
          <option>Lodo de ETE/ETA</option>
          <option>Outros</option>
        </select>
        <div class="field-error" id="erro-tipo_residuo"></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="classe_residuo">Classe NBR 10004 <span class="required-mark" aria-hidden="true">*</span></label>
          <select id="classe_residuo" aria-required="true" aria-describedby="erro-classe_residuo">
            <option value="">— Classe —</option>
            <option value="Classe I – Perigoso">I – Perigoso</option>
            <option value="Classe IIA – Não Inerte">IIA – Não Inerte</option>
            <option value="Classe IIB – Inerte">IIB – Inerte</option>
            <option value="A definir">A definir</option>
          </select>
          <div class="field-error" id="erro-classe_residuo"></div>
        </div>
        <div class="field">
          <label for="frequencia">Frequência <span class="opt">(opc.)</span></label>
          <select id="frequencia">
            <option value="">— Selecione —</option>
            <option>Única (spot)</option>
            <option>Semanal</option>
            <option>Quinzenal</option>
            <option>Mensal</option>
            <option>Trimestral</option>
            <option>Sob demanda</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="quantidade">Quantidade <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="number" id="quantidade" placeholder="0" min="0" step="0.01" inputmode="decimal" aria-required="true" aria-describedby="erro-quantidade" />
          <div class="field-error" id="erro-quantidade"></div>
        </div>
        <div class="field">
          <label for="unidade">Unidade <span class="required-mark" aria-hidden="true">*</span></label>
          <select id="unidade" aria-required="true" aria-describedby="erro-unidade">
            <option value="">— Un —</option>
            <option>kg</option>
            <option>ton</option>
            <option>m³</option>
            <option>L</option>
            <option>tambor</option>
            <option>IBC</option>
            <option>big bag</option>
            <option>caçamba</option>
          </select>
          <div class="field-error" id="erro-unidade"></div>
        </div>
      </div>
      <div class="field">
        <label for="acondicionamento">Acondicionamento atual <span class="opt">(opcional)</span></label>
        <input type="text" id="acondicionamento" placeholder="Ex: big bags, tambores 200L" />
      </div>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="section-title"><span aria-hidden="true">📝</span> Observações</div>
    <div class="card">
      <div class="field">
        <label for="observacoes">Observações <span class="opt">(opcional)</span></label>
        <textarea id="observacoes" placeholder="Características do resíduo, condições do local, informações adicionais..."></textarea>
      </div>
    </div>

    <!-- FOTOS -->
    <div class="section-title"><span aria-hidden="true">📷</span> Registro fotográfico</div>
    <div class="card">
      <div class="foto-actions">
        <label class="foto-btn" id="btn-camera">
          <input type="file" id="foto-camera" class="sr-only" accept="image/*" capture="environment" />
          <span class="ico" aria-hidden="true">📷</span>
          Tirar foto
        </label>
        <label class="foto-btn" id="btn-galeria">
          <input type="file" id="foto-galeria" class="sr-only" accept="image/*" multiple />
          <span class="ico" aria-hidden="true">🖼️</span>
          Escolher da galeria
        </label>
      </div>
      <div class="foto-meta" aria-live="polite">
        <span id="foto-status">As fotos são reduzidas automaticamente</span>
        <span id="foto-count">0/5</span>
      </div>
      <div class="fotos-preview" id="fotos-preview"></div>
    </div>

    <button type="button" class="btn-submit" id="btn-submit">
      <span class="spinner" aria-hidden="true"></span>
      <span id="btn-text">Enviar para orçamento</span>
    </button>
  </main>

  <!-- ===================== CONFIRMAÇÃO ===================== -->
  <section id="sucesso" aria-live="polite">
    <div class="sucesso-card">
      <div class="sucesso-ico" aria-hidden="true">✓</div>
      <h2>Orçamento enviado</h2>
      <p>Os dados foram registrados com sucesso.</p>
      <ul class="resumo" id="resumo"></ul>
      <button type="button" class="btn-secondary" id="btn-novo">Novo orçamento</button>
    </div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite">
  <div class="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

];

let sb = null;
let fotos = [];        // { blob, ext, previewUrl, remoteUrl }
let processando = 0;   // fotos sendo reduzidas neste momento
let enviando = false;
let toastTimer = null;
let rascunhoTimer = null;

const $ = id => document.getElementById(id);

/* Data local (não UTC): evita gravar o dia seguinte após as 21h no Brasil */
function hojeLocal() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function avisar(msg) {
  const b = $('aviso-banner');
  b.textContent = msg;
  b.style.display = 'block';
}

document.addEventListener('DOMContentLoaded', () => {
  $('data-header').textContent =
    new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
  $('data_visita').value = hojeLocal();

  // Cliente Supabase: se o script do CDN não carregou, avisa em vez de quebrar a página
  try {
    if (!window.supabase || typeof SUPABASE_URL === 'undefined') throw new Error('supabase indisponível');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (err) {
    console.error(err);
    avisar('Não foi possível carregar o sistema de envio. Verifique a conexão e recarregue a página. O que você preencher fica salvo como rascunho.');
    $('btn-submit').disabled = true;
  }

  // Máscara de CNPJ
  $('cnpj').addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').substring(0, 14);
    v = v.replace(/^(\d{2})(\d)/, '$1.$2');
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
    v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
    v = v.replace(/(\d{4})(\d)/, '$1-$2');
    this.value = v;
  });

  // Limpa o erro do campo assim que o usuário corrige
  OBRIGATORIOS.forEach(([id]) => {
    const limpar = () => marcarCampo(id, true);
    $(id).addEventListener('input', limpar);
    $(id).addEventListener('change', limpar);
  });

  // Rascunho automático (texto dos campos; fotos não são guardadas)
  restaurarRascunho();
  CAMPOS.forEach(id => {
    $(id).addEventListener('input', agendarRascunho);
    $(id).addEventListener('change', agendarRascunho);
  });

  // Fotos: câmera (1 por vez) e galeria (várias)
  ['foto-camera', 'foto-galeria'].forEach(id => {
    $(id).addEventListener('change', e => {
      const lista = Array.from(e.target.files);
      e.target.value = '';           // permite escolher o mesmo arquivo de novo
      adicionarFotos(lista);
    });
  });

  $('btn-submit').addEventListener('click', enviarFormulario);
  $('btn-novo').addEventListener('click', novoOrcamento);
  atualizarFotosUI();
});

/* ===================== RASCUNHO ===================== */
function agendarRascunho() {
  clearTimeout(rascunhoTimer);
  rascunhoTimer = setTimeout(salvarRascunho, 400);
}
function salvarRascunho() {
  try {
    const d = {};
    CAMPOS.forEach(id => { d[id] = $(id).value; });
    if (CAMPOS.some(id => d[id])) localStorage.setItem(RASCUNHO_KEY, JSON.stringify(d));
    else localStorage.removeItem(RASCUNHO_KEY);
  } catch (e) { /* armazenamento indisponível: ignora */ }
}
function restaurarRascunho() {
  try {
    const raw = localStorage.getItem(RASCUNHO_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    let n = 0;
    CAMPOS.forEach(id => { if (d[id]) { $(id).value = d[id]; n++; } });
    if (n) showToast('success', 'Rascunho restaurado');
  } catch (e) { /* ignora */ }
}
function limparRascunho() {
  clearTimeout(rascunhoTimer);
  try { localStorage.removeItem(RASCUNHO_KEY); } catch (e) { /* ignora */ }
}

/* ===================== FOTOS ===================== */
async function decodificar(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* tenta via <img> */ }
  }
  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

/* Reduz a foto para ~1600px em JPEG: de 3–8 MB para cerca de 300 KB */
async function comprimir(file) {
  try {
    const img = await decodificar(file);
    const w0 = img.naturalWidth || img.width;
    const h0 = img.naturalHeight || img.height;
    const escala = Math.min(1, MAX_DIM / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * escala));
    const h = Math.max(1, Math.round(h0 * escala));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    if (img.close) img.close();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', QUALIDADE));
    if (blob && blob.size < file.size) return { blob, ext: 'jpg' };
  } catch (e) { /* formato não decodificável (ex.: HEIC no desktop): envia o original */ }
  const ext = (file.name && file.name.includes('.') ? file.name.split('.').pop() : 'jpg').toLowerCase();
  return { blob: file, ext };
}

async function adicionarFotos(lista) {
  const arquivos = lista.filter(f => !f.type || f.type.startsWith('image/'));
  if (!arquivos.length) return;
  const vagas = MAX_FOTOS - fotos.length - processando;
  if (vagas <= 0) { showToast('error', `Limite de ${MAX_FOTOS} fotos atingido`); return; }
  const usar = arquivos.slice(0, vagas);
  if (arquivos.length > vagas) {
    showToast('error', `Limite de ${MAX_FOTOS} fotos: ${arquivos.length - vagas} não adicionada(s)`);
  }
  processando += usar.length;
  atualizarFotosUI();
  for (const f of usar) {
    const r = await comprimir(f);
    fotos.push({ blob: r.blob, ext: r.ext, previewUrl: URL.createObjectURL(r.blob), remoteUrl: null });
    processando--;
    atualizarFotosUI();
  }
}

function removerFoto(i) {
  if (enviando) return;
  const f = fotos[i];
  if (f) URL.revokeObjectURL(f.previewUrl);
  fotos.splice(i, 1);
  atualizarFotosUI();
}

function atualizarFotosUI() {
  const total = fotos.length + processando;
  const cheio = total >= MAX_FOTOS;

  const prev = $('fotos-preview');
  prev.textContent = '';
  fotos.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'foto-thumb';
    const img = document.createElement('img');
    img.alt = `Foto ${i + 1}`;
    img.src = f.previewUrl;
    img.onerror = () => { img.remove(); d.insertBefore(document.createTextNode('Foto ' + (i + 1)), d.firstChild); };
    d.appendChild(img);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'remove-foto';
    b.setAttribute('aria-label', `Remover foto ${i + 1}`);
    b.addEventListener('click', () => removerFoto(i));
    d.appendChild(b);
    prev.appendChild(d);
  });
  for (let k = 0; k < processando; k++) {
    const d = document.createElement('div');
    d.className = 'foto-thumb processing';
    d.setAttribute('aria-label', 'Processando foto');
    d.innerHTML = '<div class="mini-spinner"></div>';
    prev.appendChild(d);
  }

  $('foto-count').textContent = `${total}/${MAX_FOTOS}`;
  $('foto-status').textContent = processando
    ? 'Processando fotos…'
    : cheio ? 'Limite de fotos atingido' : 'As fotos são reduzidas automaticamente';
  ['btn-camera', 'btn-galeria'].forEach(id => $(id).classList.toggle('disabled', cheio));
  $('foto-camera').disabled = cheio;
  $('foto-galeria').disabled = cheio;
}

function nomeSeguro(nomeCliente) {
  return (nomeCliente || 'cliente')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]/g, '_')
    .substring(0, 40);
}

async function uploadFoto(foto, nomeCliente) {
  const codigo = Math.random().toString(36).substring(2, 8).toUpperCase();
  const nome = `${nomeSeguro(nomeCliente)}_${codigo}.${foto.ext}`;
  const contentType = foto.blob.type || (foto.ext === 'jpg' ? 'image/jpeg' : 'application/octet-stream');
  const { error } = await sb.storage.from('fotos-residuos').upload(nome, foto.blob, { contentType });
  if (error) throw error;
  return sb.storage.from('fotos-residuos').getPublicUrl(nome).data.publicUrl;
}

/* ===================== VALIDAÇÃO ===================== */
function marcarCampo(id, ok, msg) {
  const el = $(id);
  const campo = el.closest('.field');
  campo.classList.toggle('invalid', !ok);
  el.setAttribute('aria-invalid', String(!ok));
  if (!ok && msg) $('erro-' + id).textContent = msg;
}

function validar() {
  let primeiro = null;
  for (const [id, msg] of OBRIGATORIOS) {
    const el = $(id);
    const v = el.value.trim();
    const ok = id === 'quantidade' ? parseFloat(v) > 0 : v !== '';
    marcarCampo(id, ok, msg);
    if (!ok && !primeiro) primeiro = el;
  }
  if (primeiro) {
    primeiro.scrollIntoView({ block: 'center', behavior: 'smooth' });
    primeiro.focus({ preventScroll: true });
    showToast('error', 'Preencha os campos obrigatórios');
    return false;
  }
  return true;
}

/* ===================== ENVIO ===================== */
function setCarregando(on, texto) {
  const btn = $('btn-submit');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
  $('btn-text').textContent = texto || 'Enviar para orçamento';
}

async function enviarFormulario() {
  if (enviando) return;
  if (processando > 0) { showToast('error', 'Aguarde o processamento das fotos'); return; }
  if (!validar()) return;
  if (!sb) { showToast('error', 'Sistema de envio indisponível. Recarregue a página.'); return; }
  if (navigator.onLine === false) {
    showToast('error', 'Sem conexão com a internet. Seus dados continuam no formulário.');
    return;
  }

  enviando = true;
  setCarregando(true, 'Enviando…');

  try {
    const nomeCliente = $('nome_cliente').value.trim();
    const total = fotos.length;
    let feitas = fotos.filter(f => f.remoteUrl).length;

    // Upload em paralelo; fotos já enviadas numa tentativa anterior não são reenviadas
    if (total && feitas < total) {
      setCarregando(true, `Enviando fotos ${feitas}/${total}…`);
      await Promise.all(fotos.filter(f => !f.remoteUrl).map(async f => {
        f.remoteUrl = await uploadFoto(f, nomeCliente);
        feitas++;
        $('btn-text').textContent = `Enviando fotos ${feitas}/${total}…`;
      }));
    }

    $('btn-text').textContent = 'Salvando…';
    const registro = {
      data_visita:      hojeLocal(),
      nome_cliente:     nomeCliente,
      cnpj:             $('cnpj').value.trim() || null,
      email:            $('email').value.trim() || null,
      telefone:         $('telefone').value.trim() || null,
      endereco:         $('endereco').value.trim() || null,
      tipo_residuo:     $('tipo_residuo').value,
      classe_residuo:   $('classe_residuo').value,
      quantidade:       parseFloat($('quantidade').value),
      unidade:          $('unidade').value,
      frequencia:       $('frequencia').value || null,
      acondicionamento: $('acondicionamento').value.trim() || null,
      observacoes:      $('observacoes').value.trim() || null,
      fotos:            total ? fotos.map(f => f.remoteUrl) : null,
      data_coleta:      new Date().toISOString(),
    };

    const { error } = await sb.from('orcamentos').insert([registro]);
    if (error) throw error;

    mostrarSucesso(registro, total);
    limparFormulario();
  } catch (err) {
    console.error(err);
    showToast('error', 'Erro ao enviar. Seus dados foram mantidos; verifique a conexão e tente de novo.');
  } finally {
    enviando = false;
    setCarregando(false);
  }
}

/* ===================== PÓS-ENVIO ===================== */
function mostrarSucesso(r, nFotos) {
  const linhas = [
    ['Cliente', r.nome_cliente],
    ['Resíduo', r.tipo_residuo],
    ['Quantidade', `${r.quantidade.toLocaleString('pt-BR')} ${r.unidade}`],
    ['Fotos', String(nFotos)],
  ];
  const ul = $('resumo');
  ul.textContent = '';
  linhas.forEach(([k, v]) => {
    const li = document.createElement('li');
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('span'); b.textContent = v;
    li.append(a, b);
    ul.appendChild(li);
  });
  clearTimeout(toastTimer);
  $('toast').classList.remove('show');   // não deixa um erro antigo sobre a confirmação
  $('form-area').style.display = 'none';
  $('sucesso').style.display = 'block';
  window.scrollTo({ top: 0 });
}

function novoOrcamento() {
  $('sucesso').style.display = 'none';
  $('form-area').style.display = 'block';
  window.scrollTo({ top: 0 });
}

function limparFormulario() {
  CAMPOS.forEach(id => {
    const el = $(id);
    if (el.tagName === 'SELECT') el.selectedIndex = 0; else el.value = '';
  });
  OBRIGATORIOS.forEach(([id]) => marcarCampo(id, true));
  $('data_visita').value = hojeLocal();
  fotos.forEach(f => URL.revokeObjectURL(f.previewUrl));
  fotos = [];
  atualizarFotosUI();
  limparRascunho();
}

function showToast(type, msg) {
  const t = $('toast');
  t.className = type;
  $('toast-msg').textContent = msg;
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
</script>
