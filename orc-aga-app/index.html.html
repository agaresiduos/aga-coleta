<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Orçamento de Resíduos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

    :root {
      --bg:        #d4edda;
      --surface:   #ffffff;
      --header:    #1a5c2a;
      --border:    #7aba8a;
      --accent:    #1a5c2a;
      --text:      #0d1f0f;
      --label:     #1a3d20;
      --muted:     #3d6b47;
      --placeholder: #7aaa82;
      --input-bg:  #f0faf2;
      --danger:    #c0392b;
      --radius:    8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      background: var(--header);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon { font-size: 20px; }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .header-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: #a8d8b4;
    }

    #config-banner {
      background: #fdecea;
      border: 2px solid var(--danger);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 16px;
      font-size: 13px;
      color: var(--danger);
      display: none;
    }
    #config-banner strong { display: block; margin-bottom: 4px; }
    #config-banner code {
      background: rgba(192,57,43,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .form-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      background: var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 20px 0 12px;
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .field { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--label);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    label .opt {
      font-weight: 400;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid #9dc7a5;
      border-radius: var(--radius);
      padding: 11px 13px;
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    input::placeholder, textarea::placeholder {
      color: var(--placeholder);
      font-weight: 400;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(26,92,42,0.12);
    }

    input[readonly] {
      background: #e8f5eb;
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      cursor: default;
      border-color: var(--border);
    }

    select { cursor: pointer; }
    select option { background: #fff; color: var(--text); }

    textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .foto-area {
      background: var(--input-bg);
      border: 2px dashed #9dc7a5;
      border-radius: var(--radius);
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }

    .foto-area:hover { border-color: var(--accent); background: #e4f5e8; }

    .foto-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }

    .foto-icon { font-size: 30px; margin-bottom: 6px; }
    .foto-label { font-size: 14px; font-weight: 700; color: var(--accent); }
    .foto-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .fotos-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    .foto-thumb {
      position: relative; width: 76px; height: 76px;
      border-radius: 6px; overflow: hidden; border: 2px solid var(--border);
    }

    .foto-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .foto-thumb .remove-foto {
      position: absolute; top: 3px; right: 3px;
      background: rgba(0,0,0,0.65); color: #fff; border: none;
      border-radius: 50%; width: 20px; height: 20px; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 24px;
      box-shadow: 0 3px 10px rgba(26,92,42,0.3);
      transition: background 0.2s, transform 0.1s;
      position: relative;
    }

    .btn-submit:hover  { background: #14471f; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #7aaa82; cursor: not-allowed; box-shadow: none; }

    .btn-submit .spinner {
      display: none; width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto;
    }

    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner  { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(90px);
      border-radius: 50px; padding: 13px 24px;
      font-size: 14px; font-weight: 600; color: #fff;
      z-index: 999; white-space: nowrap;
      display: flex; align-items: center; gap: 9px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }

    #toast.show    { transform: translateX(-50%) translateY(0); }
    #toast.success { background: #1a5c2a; }
    #toast.error   { background: var(--danger); }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }

    .required-mark { color: var(--danger); margin-left: 2px; }
  </style>
</head>

  </div>

</header>

<div id="config-banner">
  <strong>⚠ Configuração necessária</strong>
  Substitua <code>COLE_SUA_URL_AQUI</code> e <code>COLE_SUA_ANON_KEY_AQUI</code> pelas credenciais do Supabase.

<div class="form-container">

  <!-- DATA -->
  <div class="section-title">📅 Data da Visita</div>
  <div class="card">
    <div class="field">
      <label>Data da Visita</label>
      <input type="date" id="data_visita" readonly />
    </div>
  </div>

  <!-- CLIENTE -->
  <div class="section-title">🏭 Dados do Cliente</div>
  <div class="card">
    <div class="field">
      <label>Razão Social / Nome <span class="required-mark">*</span></label>
      <input type="text" id="nome_cliente" placeholder="Ex: Indústria Exemplo Ltda" />
    </div>
    <div class="grid-2">
      <div class="field">
        <label>CNPJ <span class="opt">(opcional)</span></label>
        <input type="text" id="cnpj" placeholder="00.000.000/0001-00" maxlength="18" />
      </div>
      <div class="field">
        <label>Telefone <span class="opt">(opcional)</span></label>
        <input type="tel" id="telefone" placeholder="(31) 9 0000-0000" />
      </div>
    </div>
    <div class="field">
      <label>E-mail <span class="opt">(opcional)</span></label>
      <input type="email" id="email" placeholder="contato@empresa.com.br" />
    </div>
    <div class="field">
      <label>Endereço do Gerador <span class="opt">(opcional)</span></label>
      <input type="text" id="endereco" placeholder="Rua, número, cidade – UF" />
    </div>
  </div>

  <!-- RESÍDUOS -->
  <div class="section-title">🗂 Dados Técnicos dos Resíduos</div>
  <div class="card">
    <div class="field">
      <label>Tipo de Resíduo <span class="required-mark">*</span></label>
      <select id="tipo_residuo">
        <option value="">— Selecione o tipo —</option>
        <option>Resíduo Industrial Perigoso</option>
        <option>Resíduo Industrial Não Perigoso</option>
        <option>Resíduo de Construção Civil (RCC)</option>
        <option>Resíduo de Serviços de Saúde (RSS)</option>
        <option>Resíduo de Óleo e Lubrificante</option>
        <option>Resíduo Eletrônico (REEE)</option>
        <option>Resíduo Orgânico</option>
        <option>Embalagens Contaminadas</option>
        <option>Resíduo Químico Laboratorial</option>
        <option>Lodo de ETE/ETA</option>
        <option>Outros</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Classe NBR 10004 <span class="required-mark">*</span></label>
        <select id="classe_residuo">
          <option value="">— Classe —</option>
          <option value="Classe I – Perigoso">I – Perigoso</option>
          <option value="Classe IIA – Não Inerte">IIA – Não Inerte</option>
          <option value="Classe IIB – Inerte">IIB – Inerte</option>
          <option value="A definir">A definir</option>
        </select>
      </div>
      <div class="field">
        <label>Frequência <span class="opt">(opc.)</span></label>
        <select id="frequencia">
          <option value="">— Frequência —</option>
          <option>Única (spot)</option>
          <option>Semanal</option>
          <option>Quinzenal</option>
          <option>Mensal</option>
          <option>Trimestral</option>
          <option>Sob demanda</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Quantidade <span class="required-mark">*</span></label>
        <input type="number" id="quantidade" placeholder="0" min="0" step="0.01" />
      </div>
      <div class="field">
        <label>Unidade <span class="required-mark">*</span></label>
        <select id="unidade">
          <option value="">— Un —</option>
          <option>kg</option>
          <option>ton</option>
          <option>m³</option>
          <option>L</option>
          <option>tambor</option>
          <option>IBC</option>
          <option>big bag</option>
          <option>caçamba</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Acondicionamento Atual <span class="opt">(opcional)</span></label>
      <input type="text" id="acondicionamento" placeholder="Ex: big bags, tambores 200L, bombonas..." />
    </div>
  </div>

  <!-- OBSERVAÇÕES -->
  <div class="section-title">📝 Observações</div>
  <div class="card">
    <div class="field">
      <label>Observações <span class="opt">(opcional)</span></label>
      <textarea id="observacoes" placeholder="Características do resíduo, condições do local, informações adicionais..."></textarea>
    </div>
  </div>

  <!-- FOTOS -->
  <div class="section-title">📷 Registro Fotográfico</div>
  <div class="card">
    <div class="foto-area">
      <input type="file" id="foto-input" accept="image/*" multiple capture="environment" />
      <div class="foto-icon">📷</div>
      <div class="foto-label">Toque para fotografar</div>
      <div class="foto-sub">ou selecione da galeria · até 5 fotos</div>
    </div>
    <div class="fotos-preview" id="fotos-preview"></div>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="enviarFormulario()">
    <span class="btn-text">✔ Enviar para Orçamento</span>
    <div class="spinner"></div>
  </button>

</div>

<div id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
const { createClient } = supabase;
let sb = null;
let fotosFiles = [];

document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();

  // Header: dia da semana + data
  document.getElementById('data-header').textContent =
    now.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });

  // Campo data_visita: hoje, somente leitura
  document.getElementById('data_visita').value = now.toISOString().split('T')[0];

  // Verifica configuração
  if (SUPABASE_URL === 'COLE_SUA_URL_AQUI' || SUPABASE_KEY === 'COLE_SUA_ANON_KEY_AQUI') {
    document.getElementById('config-banner').style.display = 'block';
    document.getElementById('btn-submit').disabled = true;
  } else {
    sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  // Máscara CNPJ
  document.getElementById('cnpj').addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'').substring(0,14);
    v = v.replace(/^(\d{2})(\d)/,'$1.$2');
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3');
    v = v.replace(/\.(\d{3})(\d)/,'.$1/$2');
    v = v.replace(/(\d{4})(\d)/,'$1-$2');
    this.value = v;
  });

  document.getElementById('foto-input').addEventListener('change', handleFotos);
});

function handleFotos(e) {
  Array.from(e.target.files).forEach(f => { if (fotosFiles.length < 5) fotosFiles.push(f); });
  renderFotos();
}

function renderFotos() {
  const c = document.getElementById('fotos-preview');
  c.innerHTML = '';
  fotosFiles.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'foto-thumb';
    d.innerHTML = `<img src="${URL.createObjectURL(f)}"/><button class="remove-foto" onclick="removeFoto(${i})">×</button>`;
    c.appendChild(d);
  });
}

function removeFoto(i) { fotosFiles.splice(i,1); renderFotos(); }

async function uploadFoto(file, ts, nomeCliente) {
  const ext = file.name.split('.').pop();
  const clienteSlug = (nomeCliente || 'cliente')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]/g,'_')
    .substring(0, 40);
  const codigo = Math.random().toString(36).substring(2,8).toUpperCase();
  const nome = `${clienteSlug}_${codigo}.${ext}`;
  const { error } = await sb.storage.from('fotos-residuos').upload(nome, file, { contentType: file.type });
  if (error) throw error;
  return sb.storage.from('fotos-residuos').getPublicUrl(nome).data.publicUrl;
}

async function enviarFormulario() {
  const validar = [
    ['nome_cliente',   'Razão Social / Nome é obrigatório'],
    ['tipo_residuo',   'Selecione o tipo de resíduo'],
    ['classe_residuo', 'Selecione a classe do resíduo'],
    ['quantidade',     'Informe a quantidade prevista'],
    ['unidade',        'Selecione a unidade de medida'],
  ];

  for (const [id, msg] of validar) {
    const el = document.getElementById(id);
    if (!el.value.trim()) {
      showToast('error', msg);
      el.focus();
      el.style.borderColor = 'var(--danger)';
      setTimeout(() => el.style.borderColor = '', 2000);
      return;
    }
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const ts = Date.now();
    const fotos = [];
    const nomeCliente = document.getElementById('nome_cliente').value.trim();
    for (const f of fotosFiles) fotos.push(await uploadFoto(f, ts, nomeCliente));

    const { error } = await sb.from('orcamentos').insert([{
      data_visita:      document.getElementById('data_visita').value,
      nome_cliente:     document.getElementById('nome_cliente').value.trim(),
      cnpj:             document.getElementById('cnpj').value.trim() || null,
      email:            document.getElementById('email').value.trim() || null,
      telefone:         document.getElementById('telefone').value.trim() || null,
      endereco:         document.getElementById('endereco').value.trim() || null,
      tipo_residuo:     document.getElementById('tipo_residuo').value,
      classe_residuo:   document.getElementById('classe_residuo').value,
      quantidade:       parseFloat(document.getElementById('quantidade').value),
      unidade:          document.getElementById('unidade').value,
      frequencia:       document.getElementById('frequencia').value || null,
      acondicionamento: document.getElementById('acondicionamento').value.trim() || null,
      observacoes:      document.getElementById('observacoes').value.trim() || null,
      fotos:            fotos.length ? fotos : null,
      data_coleta:      new Date().toISOString(),
    }]);

    if (error) throw error;
    showToast('success', '✔ Enviado com sucesso!');
    limparFormulario();

  } catch (err) {
    console.error(err);
    showToast('error', 'Erro ao enviar. Verifique a conexão.');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function limparFormulario() {
  ['nome_cliente','cnpj','email','telefone','endereco',
   'tipo_residuo','classe_residuo','quantidade','unidade',
   'frequencia','acondicionamento','observacoes'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
  });
  document.getElementById('data_visita').value = new Date().toISOString().split('T')[0];
  fotosFiles = []; renderFotos();
  document.getElementById('foto-input').value = '';
}

function showToast(type, msg) {
  const t = document.getElementById('toast');
  t.className = type;
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>

create table orcamentos (

  endereco         text,
  tipo_residuo     text not null,
  classe_residuo   text not null,

  unidade          text not null,

alter table orcamentos disable row level security;
